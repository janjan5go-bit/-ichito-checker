<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>和京スマイ｜銀行開拓・借入統合CRM</title>
<style>
:root{
  --bg:#f3f7fb; --panel:#ffffff; --panel2:#f7fafc; --text:#162235; --muted:#6d7a8c;
  --border:#d9e2ec; --navy:#17365d; --blue:#2f6fed; --cyan:#0ea5e9; --green:#168a55;
  --green-bg:#eaf8f1; --amber:#a46500; --amber-bg:#fff4d8; --red:#b93838; --red-bg:#fdeaea;
  --purple:#7446d3; --purple-bg:#f0eaff; --shadow:0 8px 30px rgba(20,55,95,.08);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;color:var(--text);background:linear-gradient(180deg,#eef5fb 0,#f7fafc 220px,#f3f7fb 100%);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.container{max-width:1180px;margin:0 auto;padding:14px 12px 90px}
.hero{background:linear-gradient(135deg,#17365d,#275d97 62%,#3c78ba);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07);right:-50px;top:-70px}
.hero h1{font-size:23px;line-height:1.25;margin:0 0 4px;font-weight:900;letter-spacing:.01em}
.hero p{margin:0;color:#dce9f7;font-size:13px}
.toolbar{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:42px;border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:0 13px;background:rgba(255,255,255,.12);color:#fff;font-weight:800}
.btn.light{background:#fff;color:var(--navy);border-color:#fff}
.btn.outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.blue{background:var(--blue);color:#fff;border:1px solid var(--blue)}
.btn.green{background:var(--green);color:#fff;border:1px solid var(--green)}
.btn.red{background:#fff;color:var(--red);border:1px solid #f0baba}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:11px;box-shadow:0 2px 8px rgba(30,60,90,.03)}
.stat .label{font-size:11px;color:var(--muted);font-weight:700}
.stat .value{font-size:20px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}
.stat.green{background:var(--green-bg);border-color:#bce4ce}
.stat.amber{background:var(--amber-bg);border-color:#f0d28d}
.stat.purple{background:var(--purple-bg);border-color:#d3c2f6}
.panel{background:rgba(255,255,255,.88);border:1px solid var(--border);border-radius:18px;padding:12px;box-shadow:0 3px 12px rgba(30,60,90,.03);margin-bottom:10px}
.panel-title{font-weight:900;margin-bottom:8px}
.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.field{display:block;font-size:11px;color:var(--muted);font-weight:800}
.field input,.field select,.field textarea{margin-top:5px;width:100%;min-height:42px;border:1px solid var(--border);border-radius:11px;background:#fff;padding:9px 10px;color:var(--text);outline:none}
.field textarea{min-height:82px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#8bb4f7;box-shadow:0 0 0 3px rgba(47,111,237,.1)}
.edited{background:#eef4ff!important;border-color:#7aa4f8!important}
.bank{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin:9px 0;box-shadow:0 2px 10px rgba(20,55,95,.04)}
.bank[open]{border-color:#97b9e8;box-shadow:0 5px 18px rgba(38,89,145,.08)}
.bank>summary{list-style:none;padding:12px 13px;cursor:pointer}
.bank>summary::-webkit-details-marker{display:none}
.summary-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.bank-name{font-weight:900;font-size:16px}
.subline{font-size:11px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:7px}
.badges{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.badge{border:1px solid var(--border);padding:4px 7px;border-radius:9px;font-size:11px;font-weight:900;background:#f8fafc}
.badge.s{background:#e9f8ef;color:#17693d;border-color:#aadbc0}
.badge.a{background:#fff3d8;color:#8a5b00;border-color:#e9cf92}
.badge.green{background:var(--green-bg);color:var(--green);border-color:#bce4ce}
.badge.amber{background:var(--amber-bg);color:var(--amber);border-color:#ead291}
.badge.purple{background:var(--purple-bg);color:var(--purple);border-color:#d3c2f6}
.badge.red{background:var(--red-bg);color:var(--red);border-color:#efbcbc}
.arrow{font-size:16px;color:var(--muted);transition:.2s}
.bank[open] .arrow{transform:rotate(180deg)}
.progress{height:7px;border-radius:999px;background:#e8edf3;overflow:hidden;margin-top:9px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#2f6fed,#19a779);border-radius:999px}
.loan-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.q{border-radius:10px;padding:7px 8px;font-size:11px;border:1px solid var(--border);background:#f8fafc}
.q b{display:block;font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.q.green{background:var(--green-bg);border-color:#bce4ce}.q.amber{background:var(--amber-bg);border-color:#ead291}.q.purple{background:var(--purple-bg);border-color:#d3c2f6}
.bank-body{border-top:1px solid var(--border);padding:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;border:1px solid var(--border);background:#fff;min-height:40px;border-radius:11px;padding:0 11px;font-size:12px;font-weight:800}
.tab.active{background:#eaf2ff;border-color:#7faaf5;color:#1d55b7}
.pane{display:none;padding-top:10px}.pane.active{display:block}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.cols4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card{background:var(--panel2);border:1px solid #e6edf4;border-radius:14px;padding:11px}
.card h3{font-size:13px;margin:0 0 8px;font-weight:900}
.info-box{background:#edf6ff;border:1px solid #c8e0fa;border-radius:11px;padding:9px;font-size:12px;line-height:1.55}
.warn-box{background:var(--amber-bg);border:1px solid #ecd298;border-radius:11px;padding:9px;font-size:12px;line-height:1.55}
.error-box{background:var(--red-bg);border:1px solid #efbcbc;border-radius:11px;padding:9px;font-size:12px;line-height:1.55}
.links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.link-btn{min-height:40px;display:flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #c9dbef;border-radius:10px;background:#fff;color:#215c9f;font-size:12px;font-weight:900;padding:6px}
.check-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.check{display:flex;align-items:center;gap:7px;min-height:43px;border:1px solid var(--border);border-radius:10px;padding:7px 8px;background:#fff;font-size:12px;font-weight:700}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.loan{background:#fff;border:1px solid var(--border);border-radius:14px;margin:7px 0;overflow:hidden}
.loan summary{list-style:none;cursor:pointer;padding:10px}
.loan summary::-webkit-details-marker{display:none}
.loan-body{border-top:1px solid var(--border);padding:10px}
.history-box{max-height:160px;overflow:auto;display:flex;flex-direction:column;gap:5px;margin-top:7px}
.hrow{background:#f6f9fc;border-radius:9px;padding:6px 7px;font-size:11px}
.hrow .top{display:flex;justify-content:space-between;gap:8px}.hrow strong{font-variant-numeric:tabular-nums}
.timeline{max-height:410px;overflow:auto;display:flex;flex-direction:column;gap:7px}
.event{border:1px solid var(--border);border-left:4px solid #8bb4f7;background:#fff;border-radius:11px;padding:9px}
.event .meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:7px;flex-wrap:wrap}
.event .memo{font-size:12px;line-height:1.5;margin-top:4px}
.next{margin-top:6px;background:#edf6ff;border-radius:8px;padding:6px 7px;font-size:11px;font-weight:800}
.small{font-size:11px;color:var(--muted)}
.section-actions{display:flex;justify-content:space-between;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.inline-form{display:grid;grid-template-columns:1.15fr 1fr auto;gap:5px;margin-top:6px}
.inline-form input,.inline-form button{min-height:38px;border-radius:9px;border:1px solid var(--border);padding:6px 8px;background:#fff}
.inline-form button{background:#eaf2ff;font-weight:900;color:#1d55b7}
.sticky-bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));pointer-events:none}
.bottom-inner{max-width:1180px;margin:0 auto;background:rgba(17,32,53,.95);backdrop-filter:blur(10px);color:#fff;border-radius:17px;padding:9px 13px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center;pointer-events:auto}
.bottom-inner .l{font-size:10px;color:#b7c4d4}.bottom-inner .v{font-weight:900;font-size:13px;margin-top:1px}
@media(max-width:800px){
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats .stat:last-child{grid-column:span 2}
 .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
 .cols2,.cols3,.cols4{grid-template-columns:1fr}
 .check-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .links{grid-template-columns:repeat(2,minmax(0,1fr))}
 .loan-quick{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:430px){
 .container{padding-left:8px;padding-right:8px}.hero{border-radius:17px;padding:15px}.hero h1{font-size:20px}
 .summary-mid{display:none}
 .bottom-inner{grid-template-columns:repeat(4,minmax(0,1fr));padding:8px}.bottom-inner .v{font-size:12px}
 .check-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="container">
  <header class="hero">
    <h1>和京スマイ｜銀行開拓・借入統合CRM</h1>
    <p>銀行開拓、人脈、融資条件、活動履歴、借入残高・金利・返済額の履歴を銀行ごとに一元管理</p>
    <div class="toolbar">
      <button class="btn light" id="expandAll">全部展開</button>
      <button class="btn" id="closeAll">全部閉じる</button>
      <button class="btn" id="saveNow">保存</button>
      <button class="btn" id="exportJson">JSONバックアップ</button>
      <label class="btn" style="display:flex;align-items:center">JSON読込<input id="importJson" type="file" accept=".json,application/json" hidden></label>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><div class="label">対象金融機関</div><div class="value" id="statBanks">—</div></div>
    <div class="stat green"><div class="label">登録借入残債</div><div class="value" id="statBalance">—</div></div>
    <div class="stat purple"><div class="label">次回返済合計</div><div class="value" id="statNextPay">—</div></div>
    <div class="stat amber"><div class="label">未確認重要項目</div><div class="value" id="statMissing">—</div></div>
    <div class="stat"><div class="label">最終保存</div><div class="value" style="font-size:13px" id="statSaved">—</div></div>
  </section>

  <section class="panel">
    <div class="panel-title">開拓フィルター</div>
    <div class="filters">
      <label class="field">物件エリア
        <select id="regionFilter"><option value="all">関西すべて</option><option>京都府</option><option>滋賀県</option><option>大阪府</option><option>奈良県</option><option>兵庫県</option><option>和歌山県</option></select>
      </label>
      <label class="field">ランク
        <select id="rankFilter"><option value="all">S・A</option><option>S</option><option>A</option></select>
      </label>
      <label class="field">種類
        <select id="typeFilter"><option value="all">すべて</option><option>地方銀行</option><option>第二地方銀行</option><option>信用金庫</option><option>信用組合</option><option>専門系銀行</option></select>
      </label>
      <label class="field">進捗
        <select id="statusFilter"><option value="all">すべて</option><option>未連絡</option><option>既存接点あり</option><option>電話済</option><option>面談済</option><option>案件持込可</option><option>稟議中</option><option>融資実行あり</option></select>
      </label>
      <label class="field">検索
        <input id="searchFilter" type="search" placeholder="銀行・支店・担当者">
      </label>
    </div>
  </section>

  <div id="bankContainer"></div>
  <div id="emptyState" class="panel" style="display:none;text-align:center;color:var(--muted)">条件に合う金融機関がない。</div>
</div>

<div class="sticky-bottom">
  <div class="bottom-inner">
    <div><div class="l">Sランク</div><div class="v" id="bottomS">—</div></div>
    <div><div class="l">接触済</div><div class="v" id="bottomContact">—</div></div>
    <div><div class="l">借入件数</div><div class="v" id="bottomLoans">—</div></div>
    <div><div class="l">残債合計</div><div class="v" id="bottomBalance">—</div></div>
  </div>
</div>

function latest(arr,date=TODAY){return [...(arr||[])].filter(x=>x.date<=date).sort((a,b)=>b.date.localeCompare(a.date))[0]||null}
function future(arr,date=TODAY){return [...(arr||[])].filter(x=>x.date>date).sort((a,b)=>a.date.localeCompare(b.date))[0]||null}

function loanPay(l){return latest(l.paymentHistory)}

function loanPane(b){return `<div class="section-actions"><div><b>現在の借入</b><div class="small">金利・返済額・残債は「履歴追加」。過去値を消さない。</div></div><button class="btn outline" data-add-loan>＋ 借入追加</button></div>${b.loans.length?b.loans.map(l=>loanCard(b,l)).join(''):`<div class="card" style="text-align:center;color:var(--muted)">この銀行の借入は未登録</div>`}`}
function timelinePane(b){const h=[...(b.timeline||[])].sort((a,z)=>z.date.localeCompare(a.date));return `<div class="cols2">
 <form class="card" data-timeline-form><h3>活動を記録</h3><div class="cols2"><label class="field">日付<input name="date" type="date" required value="${TODAY}"></label><label class="field">種類<select name="kind"><option>電話</option><option>メール</option><option>面談</option><option>訪問</option><option>資料提出</option><option>案件持込</option><option>進捗確認</option><option>稟議</option><option>承認</option><option>否決</option><option>融資契約</option><option>融資実行</option></select></label></div><label class="field" style="margin-top:7px">相手<input name="person" placeholder="坂本様、支店長など"></label><label class="field" style="margin-top:7px">何をした・何を言われた<textarea name="memo" required></textarea></label><label class="field" style="margin-top:7px">次にすること<input name="next"></label><button class="btn blue" style="width:100%;margin-top:9px">時系列へ追加</button></form>
 <div class="card"><h3>時系列</h3><div class="timeline">${h.length?h.map(x=>`<div class="event"><div class="meta"><span>${esc(x.date)}・${esc(x.kind)}</span><span>${esc(x.person)}</span></div><div class="memo">${esc(x.memo)}</div>${x.next?`<div class="next">次 → ${esc(x.next)}</div>`:''}</div>`).join(''):`<div class="small">まだ記録なし</div>`}</div></div>
 </div>`}
function bankBlock(b){
 const p=progress(b),bal=bankBalance(b),pay=bankNextPay(b),miss=missing(b);
 return `<details class="bank" data-id="${b.id}">
 <summary>
  <div class="summary-top">
   <div><div class="badges"><span class="badge ${rankClass(b.rank)}">${b.rank}</span><span class="bank-name">${esc(b.name)}</span>${b.dirty?'<span class="badge purple">編集済</span>':''}</div><div class="subline"><span>${esc(b.type)}</span><span>${esc(b.branch)}</span><span>${esc(status(b))}</span><span>進捗 ${p}%</span></div></div>
   <div class="arrow">▼</div>
  </div>
  <div class="progress"><i style="width:${p}%"></i></div>
  ${b.loans.length?`<div class="loan-quick"><div class="q green"><span>残債</span><b>${yen(bal)}</b></div><div class="q amber"><span>次回返済合計</span><b>${yen(pay)}</b></div><div class="q purple"><span>借入</span><b>${b.loans.length}件</b></div><div class="q"><span>担当者</span><b>${esc(b.people.officer||'未登録')}</b></div></div>`:''}
  ${miss?`<div class="warn-box" style="margin-top:7px;padding:6px 8px">未確認重要項目 ${miss}件</div>`:''}
 </summary>
 <div class="bank-body">
  <div class="tabs">
   <button class="tab active" data-tab="overview">概要・URL</button><button class="tab" data-tab="people">担当者・支店長</button><button class="tab" data-tab="progress">開拓・資料</button><button class="tab" data-tab="loans">借入・残債</button><button class="tab" data-tab="criteria">融資条件</button><button class="tab" data-tab="timeline">時系列</button>
  </div>
  <div class="pane active" data-pane="overview">${overview(b)}</div>
  <div class="pane" data-pane="people">${peoplePane(b)}</div>
  <div class="pane" data-pane="progress">${progressPane(b)}</div>
  <div class="pane" data-pane="loans">${loanPane(b)}</div>
  <div class="pane" data-pane="criteria">${criteriaPane(b)}</div>
  <div class="pane" data-pane="timeline">${timelinePane(b)}</div>
 </div></details>`
}
function render(){
 const list=filtered(); $('#emptyState').style.display=list.length?'none':'block'; $('#bankContainer').innerHTML=list.map(bankBlock).join('');
 const balance=banks.reduce((s,b)=>s+bankBalance(b),0),next=banks.reduce((s,b)=>s+bankNextPay(b),0),loans=banks.reduce((s,b)=>s+b.loans.length,0),contacts=banks.filter(b=>status(b)!=='未連絡').length;
 $('#statBanks').textContent=banks.length;$('#statBalance').textContent=yen(balance);$('#statNextPay').textContent=yen(next);$('#statMissing').textContent=banks.reduce((s,b)=>s+missing(b),0);
 $('#bottomS').textContent=banks.filter(b=>b.rank==='S').length;$('#bottomContact').textContent=contacts;$('#bottomLoans').textContent=loans;$('#bottomBalance').textContent=yen(balance);
 bind();
}
function mark(b,el){b.dirty=true;if(el)el.classList.add('edited');save()}
function bind(){
 $$('.bank').forEach(det=>{
  const b=banks.find(x=>x.id===det.dataset.id);
  det.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{det.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));det.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));t.classList.add('active');det.querySelector(`[data-pane="${t.dataset.tab}"]`).classList.add('active')});
  det.querySelectorAll('[data-person]').forEach(x=>x.onchange=e=>{b.people[e.target.dataset.person]=e.target.value;mark(b,e.target);render()});
  det.querySelectorAll('[data-bank]').forEach(x=>x.onchange=e=>{b[e.target.dataset.bank]=e.target.value;mark(b,e.target);render()});
  det.querySelectorAll('[data-stage]').forEach(x=>x.onchange=e=>{b.stages[+e.target.dataset.stage]=e.target.checked;mark(b);render()});
  det.querySelectorAll('[data-doc]').forEach(x=>x.onchange=e=>{b.docs[+e.target.dataset.doc]=e.target.checked;mark(b);render()});
  det.querySelectorAll('[data-criteria]').forEach(x=>x.onchange=e=>{b.criteria[e.target.dataset.criteria]=e.target.value;mark(b,e.target);render()});
  det.querySelectorAll('[data-loan-nextdate]').forEach(x=>x.onchange=e=>{const l=b.loans.find(z=>z.id===e.target.dataset.loanNextdate);l.nextPaymentDate=e.target.value;mark(b,e.target);render()});
  det.querySelectorAll('[data-loan-note]').forEach(x=>x.onchange=e=>{const l=b.loans.find(z=>z.id===e.target.dataset.loanNote);l.notes=e.target.value;mark(b,e.target);render()});
  det.querySelectorAll('[data-rate-form]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const l=b.loans.find(z=>z.id===f.dataset.rateForm),d=new FormData(f);l.rateHistory.push({date:String(d.get('date')),rate:Number(d.get('value')),note:'手入力追加'});mark(b);render()});
  det.querySelectorAll('[data-pay-form]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const l=b.loans.find(z=>z.id===f.dataset.payForm),d=new FormData(f);l.paymentHistory.push({date:String(d.get('date')),amount:Number(d.get('value')),note:'手入力追加'});mark(b);render()});
  det.querySelectorAll('[data-bal-form]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const l=b.loans.find(z=>z.id===f.dataset.balForm),d=new FormData(f);l.balanceSnapshots.push({date:String(d.get('date')),amount:Number(d.get('value')),quality:'実績',note:'最新明細・通帳等から入力'});mark(b);render()});
  const tf=det.querySelector('[data-timeline-form]');if(tf)tf.onsubmit=e=>{e.preventDefault();const d=new FormData(tf);b.timeline.push({date:String(d.get('date')),kind:String(d.get('kind')),person:String(d.get('person')),memo:String(d.get('memo')),next:String(d.get('next'))});if(d.get('next'))b.nextAction=String(d.get('next'));mark(b);render()};
  const add=det.querySelector('[data-add-loan]');if(add)add.onclick=()=>{const name=prompt('借入名・対象物件名');if(!name)return;const principal=Number(prompt('当初借入額（円）')||0);b.loans.push({id:'loan-'+Date.now(),name,purpose:'',principal,startDate:TODAY,firstPaymentDate:'',maturity:'',repaymentMethod:'',rateType:'',nextPaymentDate:'',source:'手入力',balanceSnapshots:principal?[{date:TODAY,amount:principal,quality:'実績',note:'登録時残高'}]:[],rateHistory:[],paymentHistory:[],notes:''});mark(b);render()}
 })
}
['regionFilter','rankFilter','typeFilter','statusFilter'].forEach(id=>$('#'+id).onchange=render);$('#searchFilter').oninput=render;
$('#expandAll').onclick=()=>$$('.bank').forEach(x=>x.open=true);$('#closeAll').onclick=()=>$$('.bank').forEach(x=>x.open=false);
$('#saveNow').onclick=()=>{save();alert('保存した。次回このHTMLを同じブラウザで開けば内容を保持する。')};
$('#exportJson').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,asOf:TODAY,banks},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='wakyo_bank_crm_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('#importJson').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(String(r.result));if(!Array.isArray(o.banks))throw new Error();banks=o.banks;save();render();alert('バックアップを読み込んだ。')}catch(_){alert('読み込めないJSONです。')}e.target.value=''};r.readAsText(f)};
render();save();
})();
</script>
</body>
</html>
